<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan - IoT Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="settings-page">
        
        <!-- HEADER -->
        <header class="settings-header">
            <button id="backBtn" class="icon-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Kembali
            </button>
            <h1>Pengaturan Tampilan</h1>
            <div class="spacer"></div> <!-- Penjaga keseimbangan flexbox -->
        </header>

        <!-- KONTEN UTAMA (Akan di-scroll jika panjang) -->
        <main class="settings-content" id="dynamic-settings-container">
            <div class="loading-state">
                <p>Memuat data widget dari server...</p>
            </div>
        </main>

        <!-- FOOTER (Sticky di bawah) -->
        <footer class="settings-footer">
            <button id="saveBtn" class="primary-btn">Simpan Pengaturan</button>
        </footer>

    </div>

    <script src="settings.js"></script>
</body>
</html>
