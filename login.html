<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IoT Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>IoT Dashboard</h1>
            <p class="subtitle">Sistem Monitoring Real-time</p>
            
            <form id="login-form">
                <!-- URL Database (DIKUNCI / READONLY) -->
                <div class="form-group">
                    <label for="db-url">URL Database Firebase</label>
                    <input type="text" id="db-url" value="https://belajar-iot-dd733-default-rtdb.firebaseio.com" readonly required style="background: rgba(255, 255, 255, 0.1); cursor: not-allowed;">
                </div>
                
                <!-- Token / Secret (DIKUNCI / READONLY) -->
                <div class="form-group">
                    <label for="db-secret">Token / Database Secret</label>
                    <input type="text" id="db-secret" value="w2biuKjj4lzr0yOZww36FEJTQMgbuwsgzVqb9coG" readonly required style="background: rgba(255, 255, 255, 0.1); cursor: not-allowed;">
                </div>
                
                <!-- User ID (WAJIB DIISI SISWA) -->
                <div class="form-group">
                    <label for="user-id">User ID Kamu</label>
                    <input type="text" id="user-id" placeholder="Contoh: latif, kelompok1, dll" required>
                </div>

                <!-- WiFi Credentials - Side by Side (Sudah terisi default) -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="wifiSsid">📶 Nama WiFi (SSID)</label>
                        <input type="text" id="wifiSsid" value="UMS Wifi" required>
                    </div>
                    <div class="form-group">
                        <label for="wifiPass">🔒 Password WiFi</label>
                        <input type="text" id="wifiPass" value="ums.wifi" required>
                    </div>
                </div>
                
                <button type="submit" class="login-btn">Masuk ke Dashboard</button>
            </form>
            
            <div class="hint">
                <strong>Catatan:</strong> Database dan Token sudah dikonfigurasi oleh asisten lab. Kamu hanya perlu mengisi <strong>User ID</strong> unik kamu.
            </div>
        </div>
    </div>

    <!-- OVERLAY ANIMASI (Tersembunyi secara default) -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p id="loadingText">Memverifikasi kredensial & menyiapkan data...</p>
    </div>

    <!-- Muat adduser.js DULUAN, baru login.js -->
    <script src="adduser.js"></script>
    <script src="login.js"></script>
</body>
</html>
